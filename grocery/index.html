<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stop & Shop order</title>
  <style>
    :root {
      --bg: #f3f1eb;
      --card: #ffffff;
      --text: #14181f;
      --muted: #6b7280;
      --accent: #0d7a55;
      --accent-hover: #0a6244;
      --border: #e5e0d6;
      --danger: #c43c3c;
      --sale: #15803d;
      --badge-bg: #dcfce7;
      --header-bg: rgba(243,241,235,0.88);
      --shadow: 0 1px 2px rgba(20,24,31,0.04), 0 8px 24px rgba(20,24,31,0.06);
      --radius: 14px;
      --focus: 0 0 0 3px rgba(13,122,85,0.25);
    }
    html[data-theme="dark"] {
      --bg: #0f1115;
      --card: #1a1e27;
      --text: #eef0f4;
      --muted: #9aa3b2;
      --accent: #34d399;
      --accent-hover: #6ee7b7;
      --border: #2a3140;
      --danger: #fb7185;
      --sale: #4ade80;
      --badge-bg: #14532d;
      --header-bg: rgba(15,17,21,0.9);
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 10px 28px rgba(0,0,0,0.35);
      --focus: 0 0 0 3px rgba(52,211,153,0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(13,122,85,0.08), transparent 55%),
        radial-gradient(900px 400px at 100% 0%, rgba(20,24,31,0.05), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    html[data-theme="dark"] body {
      background:
        radial-gradient(1000px 420px at 0% -10%, rgba(52,211,153,0.08), transparent 55%),
        radial-gradient(800px 360px at 100% 0%, rgba(99,102,241,0.08), transparent 45%),
        var(--bg);
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--header-bg);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }
    .header-inner { max-width: 760px; margin: 0 auto; }
    h1 {
      font-size: 1.25rem; margin: 0;
      letter-spacing: -0.02em; font-weight: 700;
    }
    .sub { color: var(--muted); font-size: 0.84rem; margin-top: 2px; }
    .bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-top: 12px;
    }
    .total {
      font-weight: 750; font-size: 1.2rem; color: var(--accent);
      margin-right: auto; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 550;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    }
    button:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: none; box-shadow: var(--focus); }
    button.primary {
      background: var(--accent); color: #fff; border-color: transparent;
    }
    button.primary:hover { background: var(--accent-hover); }
    html[data-theme="dark"] button.primary { color: #06281c; }
    main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 14px 8px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    section h2 {
      font-size: 0.78rem; margin: 8px 2px 4px;
      display: flex; justify-content: space-between; gap: 8px;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); font-weight: 700;
    }
    .count { color: var(--muted); font-weight: 600; font-size: 0.78rem; letter-spacing: 0; text-transform: none; }
    .item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 108px 80px;
      gap: 8px 10px;
      align-items: start;
      padding: 10px 2px;
      border-top: 1px solid var(--border);
    }
    .item:first-of-type { border-top: none; }
    .item:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); border-radius: 10px; }
    .item input[type=checkbox] {
      width: 18px; height: 18px; margin: 7px 0 0; justify-self: center;
      accent-color: var(--accent);
    }
    .main {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
      min-width: 0; padding-top: 2px;
    }
    .name {
      font-weight: 600; min-width: 0;
      white-space: normal; overflow-wrap: anywhere; line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .meta { color: var(--muted); font-size: 0.8rem; white-space: nowrap; flex-shrink: 0; }
    .prices {
      text-align: right; font-variant-numeric: tabular-nums;
      width: 80px; justify-self: end; margin-top: 4px;
    }
    .reg { color: var(--muted); font-size: 0.92rem; }
    .reg.on-sale { text-decoration: line-through; font-size: 0.8rem; opacity: 0.85; }
    .sale { color: var(--sale); font-weight: 750; }
    .qty-row {
      display: grid;
      grid-template-columns: 32px 28px 32px;
      align-items: center;
      justify-items: center;
      width: 108px;
      margin-top: 2px;
      background: color-mix(in srgb, var(--border) 45%, transparent);
      border-radius: 999px;
      padding: 2px;
    }
    .qty-val { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
    button.step {
      width: 32px; height: 32px; padding: 0; font-size: 1rem; line-height: 1;
      border-radius: 999px; border: none; background: var(--card);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    button.step:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 8px; white-space: pre-wrap; min-height: 0; }
    .status:empty { display: none; }
    .status.ready { color: var(--accent); font-weight: 650; }
    .status.err { color: var(--danger); }
    .badge {
      display: inline-block; font-size: 0.68rem; font-weight: 750;
      color: var(--sale); background: var(--badge-bg); border-radius: 999px;
      padding: 2px 7px; margin-left: 6px; vertical-align: middle;
      letter-spacing: 0.04em;
    }
    #setup {
      display: none; max-width: 760px; margin: 14px auto 0; padding: 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    #setup.show { display: block; }
    #setup textarea {
      width: 100%; min-height: 72px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
    }
    #setup .warn { color: var(--danger); font-size: 0.85rem; margin: 8px 0; }
    @media (max-width: 560px) {
      .item { grid-template-columns: 22px minmax(0, 1fr) 96px; }
      .prices { grid-column: 2; width: auto; justify-self: start; margin: 0 0 0 0; }
      .qty-row { grid-column: 3; grid-row: 1 / span 2; align-self: center; width: 96px; grid-template-columns: 28px 24px 28px; }
      button.step { width: 28px; height: 28px; }
    }
    .store-switch {
      display: flex; width: 100%; max-width: 420px; margin: 0 0 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px; gap: 3px; box-shadow: var(--shadow);
    }
    .store-switch button {
      flex: 1; border: 0; border-radius: 999px; padding: 8px 10px;
      background: transparent; color: var(--muted); font-weight: 650; white-space: nowrap;
    }
    .store-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    html[data-theme="dark"] .store-switch button[aria-pressed="true"] { color: #06281c; }
    .empty-state { text-align: center; padding: 28px 16px; color: var(--muted); }
    .empty-state strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }
    body.locked #clear, body.locked #ready, body.locked #total { display: none; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="store-switch" role="group" aria-label="Store">
        <button type="button" data-store="ss" aria-pressed="true">Stop &amp; Shop</button>
        <button type="button" data-store="wf" aria-pressed="false">Whole Foods</button>
      </div>
      <h1>Grocery order</h1>
      <div class="sub" id="store">Loading…</div>
      <div class="sub" id="salesMeta"></div>
      <div class="bar">
        <div class="total" id="total">$0.00</div>
        <button type="button" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">Dark</button>
        <button type="button" id="settings">Settings</button>
        <button type="button" id="clear">Clear</button>
        <button type="button" class="primary" id="ready">Ready for cart</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>
  <div id="setup">
    <strong>One-time setup</strong>
    <p class="sub">Paste a fine-grained GitHub PAT for <code>Dan-Lipman/grocery-order</code> only (Contents: Read and write, Metadata: Read-only). Stored in this browser only.</p>
    <p class="warn">Do not use a broad classic token.</p>
    <textarea id="tokenInput" placeholder="github_pat_…"></textarea>
    <div class="bar" style="margin-top:8px">
      <button type="button" class="primary" id="saveToken">Save &amp; test token</button>
      <button type="button" id="clearToken">Remove token</button>
    </div>
  </div>
  <main id="main"></main>
  <script>
    const CFG = window.GROCERY_CONFIG || {};
    const REPO = CFG.repo || "Dan-Lipman/grocery-order";
    // Per-store data: S&S keeps the original files; Whole Foods has its own.
    const STORES = {
      ss: { name: "Stop & Shop", file: CFG.selectionsFile || "selections.json", list: CFG.listUrl || "data/list.json", sales: CFG.salesUrl || "data/sales.json", label: "Stop & Shop #631 · 215 Glastonbury Blvd" },
      wf: { name: "Whole Foods", file: "wf-selections.json", list: "data/wf-list.json", sales: "data/wf-sales.json", label: "Whole Foods via Amazon" },
    };
    const STORE_KEY = "grocery_store";
    let storeKey = STORES[localStorage.getItem(STORE_KEY)] ? localStorage.getItem(STORE_KEY) : "ss";
    let FILE = STORES[storeKey].file;
    let LIST_URL = STORES[storeKey].list;
    let SALES_URL = STORES[storeKey].sales;
    const TOKEN_KEY = "grocery_gh_pat";
    const money = (n) => "$" + (Number(n) || 0).toFixed(2);

    let catalog = null;
    let sales = { matched: {}, suggestions: [] };
    let selected = new Set();
    let quantities = {};
    let ready = false;
    let fileSha = null;
    let saveChain = Promise.resolve();

    function token() { return (localStorage.getItem(TOKEN_KEY) || "").trim(); }
    function setStatus(text, cls) {
      const st = document.getElementById("status");
      st.textContent = text;
      st.className = "status" + (cls ? " " + cls : "");
    }
    function enqueueSave(fn) {
      saveChain = saveChain.then(fn, fn);
      return saveChain;
    }
    function unitPrice(id, item) {
      const m = sales.matched[id];
      if (m && m.sale_price != null) return Number(m.sale_price);
      return Number(item.price) || 0;
    }
    function roundQty(n, step) {
      const s = Number(step) || 1;
      const r = Math.round(n / s) * s;
      return Math.round(r * 1000) / 1000;
    }
    function itemStep(item) {
      if (item && item.step != null) return Number(item.step) || 1;
      return 1;
    }
    function itemMin(item) {
      if (item && item.min_qty != null) return Number(item.min_qty) || itemStep(item);
      return itemStep(item);
    }
    function defaultQty(item) {
      const q = String(item.qty || "1");
      const m = q.match(/(\d+(?:\.\d+)?)/);
      if (!m) return 1;
      const n = Number(m[1]);
      return n > 0 ? n : 1;
    }
    function qtyOf(id, item) {
      if (quantities[id] != null) return quantities[id];
      return defaultQty(item);
    }
    function formatQty(n) {
      if (Number.isInteger(n)) return String(n);
      return String(Math.round(n * 1000) / 1000);
    }

    function explainAuthError(status, body) {
      if (status === 401 || status === 403) {
        return "GitHub rejected the token (" + status + "). Need Contents R/W + Metadata read on " + REPO + ". " + body;
      }
      if (status === 404) return "Repo/file not visible with this token. " + body;
      if (status === 422) return "Could not update file (stale sha?). " + body;
      return status + " " + body;
    }

    async function gh(path, opts = {}) {
      const t = token();
      if (!t) throw new Error("missing token — open Settings and paste your fine-grained PAT");
      const res = await fetch("https://api.github.com" + path, {
        ...opts,
        cache: "no-store",
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: "Bearer " + t,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(opts.body ? { "Content-Type": "application/json" } : {}),
          ...(opts.headers || {}),
        },
      });
      const textBody = await res.text();
      if (!res.ok) {
        let body = textBody.slice(0, 300);
        try {
          const j = JSON.parse(textBody);
          body = j.message || body;
        } catch (_) {}
        const err = new Error(explainAuthError(res.status, body));
        err.status = res.status;
        throw err;
      }
      if (res.status === 204 || !textBody) return null;
      return JSON.parse(textBody);
    }

    // Private data files (list/sales) live in the private repo; read raw via Contents API.
    async function ghRaw(path) {
      const t = token();
      if (!t) { const e = new Error("missing token"); e.status = 401; throw e; }
      const res = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + path + "?ref=main&ts=" + Date.now(), {
        cache: "no-store",
        headers: { Accept: "application/vnd.github.raw", Authorization: "Bearer " + t, "X-GitHub-Api-Version": "2022-11-28" },
      });
      if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
      return res.json();
    }
    function renderLocked() {
      catalog = null; sales = { matched: {}, suggestions: [] }; selected = new Set(); quantities = {}; ready = false;
      document.getElementById("store").textContent = STORES[storeKey].name;
      document.getElementById("salesMeta").textContent = "";
      document.getElementById("total").textContent = "";
      const main = document.getElementById("main");
      main.innerHTML = '<section><div class="empty-state locked"><strong>Enter your token in Settings to view the list</strong></div></section>';
      setStatus("");
      document.body.classList.add("locked");
    }

    function b64encode(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin);
    }
    function b64decode(str) {
      const bin = atob(str);
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    async function refreshSha() {
      const data = await gh("/repos/" + REPO + "/contents/" + FILE + "?ref=main&ts=" + Date.now());
      fileSha = data.sha;
      return data;
    }

    async function loadSelections() {
      let data;
      try { data = await refreshSha(); }
      catch (e) {
        if (storeKey !== "ss" && e.status === 404) {
          fileSha = null; selected = new Set(); quantities = {}; ready = false; return;
        }
        throw e;
      }
      const sel = JSON.parse(b64decode(data.content.replace(/\n/g, "")));
      selected = new Set(sel.selected || []);
      quantities = sel.quantities || {};
      ready = !!sel.ready;
    }

    async function saveSelectionsOnce() {
      try { await refreshSha(); }
      catch (e) {
        if (e.status !== 404 && !String(e.message).includes("404")) throw e;
        fileSha = null;
      }
      const q = {};
      for (const id of selected) {
        if (quantities[id] != null) q[id] = quantities[id];
      }
      const sel = {
        selected: [...selected].sort(),
        quantities: q,
        ready,
        store: STORES[storeKey].name,
        updated_at: new Date().toISOString(),
      };
      const body = {
        message: "Update " + STORES[storeKey].name + " order selections",
        content: b64encode(JSON.stringify(sel, null, 2) + "\n"),
        branch: "main",
      };
      if (fileSha) body.sha = fileSha;
      const data = await gh("/repos/" + REPO + "/contents/" + FILE, {
        method: "PUT",
        body: JSON.stringify(body),
      });
      fileSha = data.content && data.content.sha;
      return sel;
    }

    async function saveSelections() {
      let lastErr;
      for (let attempt = 0; attempt < 4; attempt++) {
        try { return await saveSelectionsOnce(); }
        catch (e) {
          lastErr = e;
          const msg = String(e.message || "");
          if (e.status === 409 || msg.includes("409") || /does not match/i.test(msg)) {
            fileSha = null;
            await new Promise((r) => setTimeout(r, 150 * (attempt + 1)));
            continue;
          }
          throw e;
        }
      }
      throw lastErr;
    }

    function recompute() {
      let sum = 0;
      const byId = {};
      for (const section of catalog.sections) {
        for (const item of section.items) byId[item.id] = item;
      }
      for (const id of selected) {
        const item = byId[id];
        if (!item) continue;
        sum += unitPrice(id, item) * qtyOf(id, item);
      }
      document.getElementById("total").textContent =
        money(sum) + " · " + selected.size + " items";
      if (ready) {
        setStatus("Ready for cart", "ready");
        document.getElementById("ready").textContent = "Unmark ready";
      } else {
        setStatus("");
        document.getElementById("ready").textContent = "Ready for cart";
      }
      for (const section of document.querySelectorAll("section[data-section]")) {
        const ids = [...section.querySelectorAll("input[type=checkbox]")].map((i) => i.dataset.id);
        const n = ids.filter((id) => selected.has(id)).length;
        const c = section.querySelector(".count");
        if (c) c.textContent = n + "/" + ids.length;
      }
    }

    function persist() {
      return enqueueSave(() => saveSelections()).then(() => recompute()).catch((e) => {
        setStatus("Save failed: " + e.message, "err");
        document.getElementById("setup").classList.add("show");
      });
    }

    function renderPrices(id, item) {
      const m = sales.matched[id];
      const reg = Number(item.price) || 0;
      if (m && m.sale_price != null) {
        return (
          '<div class="prices">' +
          '<div class="reg on-sale">' + money(reg) + "</div>" +
          '<div class="sale">' + money(m.sale_price) +
          (m.sale_display ? ' <span class="meta">(' + m.sale_display + ")</span>" : "") +
          "</div></div>"
        );
      }
      return '<div class="prices"><div class="reg">' + money(reg) + "</div></div>";
    }

    function bindItemRow(row, item) {
      const id = item.id;
      const cb = row.querySelector('input[type=checkbox]');
      const down = row.querySelector("[data-down]");
      const up = row.querySelector("[data-up]");
      const val = row.querySelector("[data-qty]");

      function sync() {
        const on = selected.has(id);
        cb.checked = on;
        row.classList.toggle("checked", on);
        if (on && quantities[id] == null) quantities[id] = defaultQty(item);
        val.textContent = formatQty(qtyOf(id, item));
        down.disabled = qtyOf(id, item) <= itemMin(item) + 1e-9;
        recompute();
      }

      cb.addEventListener("change", () => {
        if (cb.checked) {
          selected.add(id);
          if (quantities[id] == null) quantities[id] = defaultQty(item);
        } else {
          selected.delete(id);
        }
        sync();
        persist();
      });
      down.addEventListener("click", () => {
        if (!selected.has(id)) return;
        const step = itemStep(item);
        const min = itemMin(item);
        quantities[id] = Math.max(min, roundQty(qtyOf(id, item) - step, step));
        sync();
        persist();
      });
      up.addEventListener("click", () => {
        const step = itemStep(item);
        if (!selected.has(id)) {
          selected.add(id);
          quantities[id] = defaultQty(item);
        } else {
          quantities[id] = roundQty(qtyOf(id, item) + step, step);
        }
        sync();
        persist();
      });
      sync();
    }

    function itemRowHtml(item) {
      const onSale = !!sales.matched[item.id];
      const bits = [];
      if (item.who) bits.push(item.who);
      if (item.note) bits.push(item.note);
      return (
        '<div class="item" data-id="' + item.id + '">' +
        '<input type="checkbox" data-id="' + item.id + '" />' +
        '<div class="main"><span class="name">' + item.name +
        (onSale ? '<span class="badge">SALE</span>' : "") +
        "</span>" +
        (bits.length ? '<span class="meta">' + bits.join(" · ") + "</span>" : "") +
        "</div>" +
        '<div class="qty-row">' +
        '<button type="button" class="step" data-down aria-label="Decrease">▾</button>' +
        '<span class="qty-val" data-qty>1</span>' +
        '<button type="button" class="step" data-up aria-label="Increase">▴</button>' +
        "</div>" +
        renderPrices(item.id, item) +
        "</div>"
      );
    }

    
    function isoWeekParity(d = new Date()) {
      // ISO week number parity for weekly A/B swap
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
      return weekNo % 2; // 0 or 1
    }
    function applyTripRotation(cat) {
      if (!cat || !Array.isArray(cat.sections)) return cat;
      const secs = cat.sections.slice();
      const aIdx = secs.findIndex((s) => s.id === "trip-a");
      const bIdx = secs.findIndex((s) => s.id === "trip-b");
      if (aIdx < 0 || bIdx < 0) return cat;
      const parity = isoWeekParity();
      // even week: A is current; odd week: B is current (swap display order + titles)
      const currentIsA = parity === 0;
      const a = secs[aIdx];
      const b = secs[bIdx];
      a.title = currentIsA ? "This week (Trip A)" : "Next week (Trip A)";
      b.title = currentIsA ? "Next week (Trip B)" : "This week (Trip B)";
      // put current trip section right after core
      const coreIdx = secs.findIndex((s) => s.id === "core");
      const rest = secs.filter((s) => s.id !== "trip-a" && s.id !== "trip-b");
      const ordered = [];
      for (const s of rest) {
        ordered.push(s);
        if (s.id === "core") {
          ordered.push(currentIsA ? a : b);
          ordered.push(currentIsA ? b : a);
        }
      }
      if (!ordered.some((s) => s.id === "trip-a")) {
        // core missing edge case
        ordered.unshift(currentIsA ? a : b);
        ordered.splice(1, 0, currentIsA ? b : a);
      }
      cat.sections = ordered;
      cat._tripCurrent = currentIsA ? "trip-a" : "trip-b";
      return cat;
    }

    function catalogHasItems() {
      return !!(catalog && (catalog.sections || []).some((s) => (s.items || []).length));
    }
    function render() {
      document.getElementById("store").textContent = STORES[storeKey].label;
      if (catalog && catalog._tripCurrent && catalogHasItems()) {
        const cur = catalog._tripCurrent === "trip-a" ? "Trip A" : "Trip B";
        document.getElementById("store").textContent += " · This week: " + cur + " (A/B swap weekly)";
      }
      const sm = document.getElementById("salesMeta");
      sm.textContent = "";
      if (sales.valid) {
        sm.textContent =
          "Sale week " + sales.valid +
          " · " + Object.keys(sales.matched || {}).length + " list items on sale";
      }
      const main = document.getElementById("main");
      main.innerHTML = "";
      if (!catalogHasItems()) {
        const el = document.createElement("section");
        el.innerHTML = '<div class="empty-state"><strong>' + STORES[storeKey].name +
          ' list coming soon</strong>Items will be added from past orders. Switch back to Stop &amp; Shop anytime.</div>';
        main.appendChild(el);
        recompute();
        return;
      }

      for (const section of catalog.sections) {
        const el = document.createElement("section");
        el.dataset.section = section.id;
        el.innerHTML =
          "<h2><span>" + section.title + '</span><span class="count"></span></h2>' +
          section.items.map(itemRowHtml).join("");
        main.appendChild(el);
        el.querySelectorAll(".item").forEach((row) => {
          const item = section.items.find((i) => i.id === row.dataset.id);
          if (item) bindItemRow(row, item);
        });
      }

      if ((sales.suggestions || []).length) {
        const el = document.createElement("section");
        el.dataset.section = "suggestions";
        el.innerHTML =
          "<h2><span>Likely buys on sale</span></h2>" +
          '<p class="meta">Extra deals this week — tap ▴ to add with quantity.</p>';
        sales.suggestions.forEach((sug, idx) => {
          const id = sug.id || ("sug-" + (sug.flyer_item_id || idx) + "-" + idx);
          const fake = {
            id,
            name: sug.name,
            price: sug.sale.unit_price,
            qty: "1",
          };
          // inject into matched so renderPrices shows green only
          if (!sales.matched[id]) {
            sales.matched[id] = {
              sale_price: sug.sale.unit_price,
              sale_display: sug.sale.display,
              regular_price: sug.sale.unit_price,
              circular_name: sug.name,
            };
          }
          // find or create a synthetic section bucket by appending rows
          const wrap = document.createElement("div");
          wrap.innerHTML = itemRowHtml(fake);
          const row = wrap.firstElementChild;
          // for suggestions, show sale price without fake strikethrough of same number
          const prices = row.querySelector(".prices");
          if (prices) {
            prices.innerHTML =
              '<div class="sale">' + money(sug.sale.unit_price) +
              (sug.sale.display ? ' <span class="meta">(' + sug.sale.display + ")</span>" : "") +
              "</div>";
          }
          el.appendChild(row);
          // allow selecting suggestions into selected set (saved by id)
          if (!catalog._suggestions) catalog._suggestions = [];
          catalog._suggestions.push(fake);
          bindItemRow(row, fake);
        });
        main.appendChild(el);
      }
      recompute();
    }

    // include suggestion items in total lookup
    const _recompute = recompute;
    recompute = function () {
      let sum = 0;
      const byId = {};
      for (const section of catalog.sections) {
        for (const item of section.items) byId[item.id] = item;
      }
      for (const item of catalog._suggestions || []) byId[item.id] = item;
      for (const id of selected) {
        const item = byId[id];
        if (!item) continue;
        sum += unitPrice(id, item) * qtyOf(id, item);
      }
      document.getElementById("total").textContent =
        money(sum) + " · " + selected.size + " items";
      if (ready) {
        setStatus("Ready for cart", "ready");
        document.getElementById("ready").textContent = "Unmark ready";
      } else {
        setStatus("");
        document.getElementById("ready").textContent = "Ready for cart";
      }
      for (const section of document.querySelectorAll("section[data-section]")) {
        const ids = [...section.querySelectorAll("input[type=checkbox]")].map((i) => i.dataset.id);
        const n = ids.filter((id) => selected.has(id)).length;
        const c = section.querySelector(".count");
        if (c) c.textContent = n + "/" + ids.length;
      }
    };

    
    const THEME_KEY = "grocery_theme";
    function applyTheme(theme) {
      const t = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem(THEME_KEY, t);
      const btn = document.getElementById("theme");
      if (btn) btn.textContent = t === "dark" ? "Light" : "Dark";
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "light");
    document.getElementById("theme").onclick = () => {
      const cur = document.documentElement.getAttribute("data-theme") || "light";
      applyTheme(cur === "dark" ? "light" : "dark");
    };

    document.getElementById("settings").onclick = () => {
      document.getElementById("setup").classList.toggle("show");
    };
    document.getElementById("saveToken").onclick = async () => {
      const v = document.getElementById("tokenInput").value.trim();
      if (!v) return;
      localStorage.setItem(TOKEN_KEY, v);
      document.getElementById("tokenInput").value = "";
      setStatus("");
      try {
        await loadStore();
        if (!catalog) throw new Error("token cannot read the list");
        document.getElementById("setup").classList.remove("show");
      } catch (e) {
        setStatus("Token test failed: " + e.message, "err");
        document.getElementById("setup").classList.add("show");
      }
    };
    document.getElementById("clearToken").onclick = () => {
      localStorage.removeItem(TOKEN_KEY);
      renderLocked();
      setStatus("Token removed from this browser.", "err");
    };
    document.getElementById("clear").onclick = async () => {
      selected = new Set();
      quantities = {};
      ready = false;
      render();
      try { await enqueueSave(() => saveSelections()); }
      catch (e) { setStatus("Clear failed: " + e.message, "err"); }
    };
    document.getElementById("ready").onclick = async () => {
      ready = !ready;
      recompute();
      try { await enqueueSave(() => saveSelections()); recompute(); }
      catch (e) { setStatus("Ready failed: " + e.message, "err"); }
    };

    function markSwitch() {
      document.querySelectorAll(".store-switch button").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.store === storeKey ? "true" : "false");
      });
    }
    let loadSeq = 0;
    document.querySelectorAll(".store-switch button").forEach((b) => {
      b.onclick = async () => {
        if (b.dataset.store === storeKey) return;
        try { await saveChain; } catch (_) {}  // finish pending saves to the old store's file
        storeKey = b.dataset.store;
        localStorage.setItem(STORE_KEY, storeKey);
        FILE = STORES[storeKey].file; LIST_URL = STORES[storeKey].list; SALES_URL = STORES[storeKey].sales;
        fileSha = null; selected = new Set(); quantities = {}; ready = false;
        markSwitch();
        setStatus("");
        loadStore().catch((e) => { document.getElementById("store").textContent = "Failed to load: " + e.message; });
      };
    });
    markSwitch();

    async function loadStore() {
      const seq = ++loadSeq;
      document.getElementById("store").textContent = "Loading…";
      document.getElementById("main").innerHTML = "";
      document.body.classList.remove("locked");
      if (!token()) { renderLocked(); return; }
      let list, salesData;
      try {
        [list, salesData] = await Promise.all([
          ghRaw(LIST_URL),
          ghRaw(SALES_URL).catch((e) => { if ([401, 403].includes(e.status)) throw e; return { matched: {}, suggestions: [] }; }),
        ]);
      } catch (e) {
        if (seq !== loadSeq) return;
        if (!e.status || [401, 403, 404].includes(e.status)) { renderLocked(); return; }
        throw e;
      }
      if (seq !== loadSeq) return;
      catalog = list;
      catalog = applyTripRotation(catalog);
      catalog._suggestions = [];
      sales = salesData || { matched: {}, suggestions: [] };
      if (!token()) {
        document.getElementById("setup").classList.add("show");
        render();
        setStatus("Add GitHub token in Settings to save.", "err");
        return;
      }
      try {
        await loadSelections();
        if (seq !== loadSeq) return;
        render();
      } catch (e) {
        document.getElementById("setup").classList.add("show");
        render();
        setStatus("Could not load saved picks: " + e.message, "err");
      }
    }
    loadStore().catch((e) => {
      document.getElementById("store").textContent = "Failed to load: " + e.message;
    });
  </script>
</body>
</html>
